<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculator">
        <h2 class="heading">CALCULATOR</h2>
        <div class="input"></div>
        <div class="line">
            <button class="large clear">BACK</button>
            <button class="clear">AC</button>
            <button class="operator">÷</button>
        </div>
        <div class="line">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">x</button>
        </div>
        <div class="line">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
        </div>
        <div class="line">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
        </div>
        <div class="line">
            <button class="large">0</button>
            <button>.</button>
            <button class="operator">=</button>
        </div>
    </div>
</body>
</html>
